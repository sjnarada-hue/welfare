<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학과 도우미</title>
<meta name="description" content="로그인, 줌·팀즈 접속, 과제 제출이 막힐 때 바로 물어보는 학과 챗봇">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학과 도우미">
<style>
  :root {
    --brand: #1d3466; --brand-strong: #14213d; --brand-soft: #e2e8f4;
    --bg: #f4f6fa; --surface: #ffffff; --text: #1a2033; --muted: #5a6378; --line: #d5dbe7;
    --me: #1d3466; --me-text: #ffffff; --on-brand: #ffffff; --accent: #a51c24; --header: #14213d; --warn: #fff4d6; --warn-line: #f0c860;
    --fs: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #9db4e8; --brand-strong: #c3d1f2; --brand-soft: #222f52;
      --bg: #0e1220; --surface: #171c2c; --text: #e8ebf3; --muted: #a0a8bd; --line: #2b3452;
      --me: #9db4e8; --me-text: #0e1220; --on-brand: #0e1220; --accent: #f08a8f; --header: #14213d; --warn: #3a3010; --warn-line: #8a6d1a;
    }
  }
  :root[data-size="large"] { --fs: 22px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: var(--fs); -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  .app { max-width: 640px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }

  header { border-bottom: 4px solid #a51c24; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--header); color: #fff; font-size: 18px; }
  header img { width: 36px; height: 36px; border-radius: 9px; background: #fff2; }
  header .title { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 1.1em; }
  header p { margin: 0; font-size: .72em; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { background: #ffffff26; border: 1px solid #ffffff55; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: .78em; cursor: pointer; white-space: nowrap; }

  .install { display: none; gap: 10px; align-items: center; padding: 10px 16px; background: var(--brand-soft); font-size: .8em; }
  .install.show { display: flex; }
  .install span { flex: 1; }
  .install button { border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .install .go { background: var(--brand); color: var(--on-brand); font-weight: 700; }
  .install .x { background: transparent; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .bot.privacy { background: var(--warn); border-color: var(--warn-line); }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-top-right-radius: 4px; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .68em; color: var(--muted); }
  .meta .speak { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; color: var(--text); }
  .badge-ai { background: var(--warn); border: 1px solid var(--warn-line); color: var(--text); border-radius: 6px; padding: 1px 6px; }
  .typing { color: var(--muted); }

  .stack { align-self: stretch; display: flex; flex-direction: column; gap: 8px; }
  .menu button { word-break: keep-all; text-align: left; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .menu button:active, .menu button:hover { border-color: var(--brand); }
  .menu .num { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent); color: var(--on-brand); display: grid; place-items: center; font-size: .85em; }
  .link { display: block; padding: 13px; border-radius: 12px; background: var(--surface); border: 2px solid var(--brand); color: var(--brand-strong); text-align: center; text-decoration: none; font-weight: 700; }
  .contact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .contact h3 { margin: 0 0 4px; font-size: 1em; }
  .contact p { margin: 0 0 10px; color: var(--muted); font-size: .8em; }
  .contact .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .contact a { flex: 1; min-width: 8em; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  .contact .call { background: var(--brand); color: var(--on-brand); }
  .contact .mail { border: 2px solid var(--brand); color: var(--brand-strong); }

  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--bg); }
  .quick:empty { display: none; }
  .quick button { flex: none; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--brand); background: var(--surface); color: var(--brand-strong); font-weight: 700; cursor: pointer; font-size: .9em; }

  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
  #q { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); }
  #q:focus { outline: none; border-color: var(--brand); }
  .icon-btn { flex: none; width: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; font-size: 1.1em; }
  .icon-btn.on { background: #e11d48; border-color: #e11d48; color: #fff; }
  .send { flex: none; padding: 0 18px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 700; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/static/icons/icon-192.png" alt="">
    <div class="title">
      <h1 id="appName">학과 도우미</h1>
      <p id="dept">막히면 언제든 물어보세요</p>
    </div>
    <button class="hbtn" id="sizeBtn" type="button" aria-pressed="false">글씨 크게</button>
    <button class="hbtn" id="homeBtn" type="button">처음으로</button>
  </header>

  <div class="install" id="install">
    <span id="installText">휴대폰 홈 화면에 추가하면 앱처럼 바로 열 수 있어요.</span>
    <button class="go" id="installGo" type="button">추가하기</button>
    <button class="x" id="installX" type="button" aria-label="닫기">✕</button>
  </div>

  <main id="log" aria-live="polite"></main>
  <div class="quick" id="quick"></div>

  <form id="f">
    <label for="q" class="sr">질문 입력</label>
    <input id="q" placeholder="궁금한 것을 적어 보세요" autocomplete="off" enterkeyhint="send">
    <button class="icon-btn" id="mic" type="button" aria-label="말로 묻기" hidden>🎤</button>
    <button class="send" type="submit">보내기</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), quick = $('quick');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let sid = store.get('sid');
if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)); store.set('sid', sid); }

// ---- 글씨 크기 ----
function applySize(large) {
  document.documentElement.dataset.size = large ? 'large' : '';
  $('sizeBtn').textContent = large ? '글씨 보통' : '글씨 크게';
  $('sizeBtn').setAttribute('aria-pressed', String(large));
}
applySize(store.get('size') === 'large');
$('sizeBtn').onclick = () => {
  const large = document.documentElement.dataset.size !== 'large';
  store.set('size', large ? 'large' : ''); applySize(large);
};

// ---- 읽어주기 ----
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[※■☎✉🕒⚠️😊⏳🙂]/g, ''));
  u.lang = 'ko-KR'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ---- 화면 그리기 ----
const LABEL = { menu: '학과 안내', ai: 'AI 답변', handoff: '사람 연결', privacy: '개인정보 보호', fallback: '안내' };

function bubble(cls, text, source) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls + (source === 'privacy' ? ' privacy' : '');
  d.textContent = text;
  if (cls === 'bot' && source) {
    const meta = document.createElement('div'); meta.className = 'meta';
    const tag = document.createElement('span');
    if (source === 'ai') { tag.className = 'badge-ai'; tag.textContent = 'AI 답변 · 틀릴 수 있어요'; }
    else tag.textContent = LABEL[source] || '';
    meta.appendChild(tag);
    if (canSpeak) {
      const s = document.createElement('button'); s.type = 'button'; s.className = 'speak'; s.textContent = '🔊 읽어주기';
      s.onclick = () => speak(text); meta.appendChild(s);
    }
    d.appendChild(meta);
  }
  log.appendChild(d);
  return d;
}

function stack(cls) { const s = document.createElement('div'); s.className = 'stack ' + cls; log.appendChild(s); return s; }

function render(r) {
  bubble('bot', r.text, r.source);

  if (r.menu.length) {
    const m = stack('menu');
    r.menu.forEach((label, i) => {
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span class="num"></span><span></span>';
      b.children[0].textContent = i + 1; b.children[1].textContent = label;
      b.onclick = () => send(label); m.appendChild(b);
    });
  }

  if (r.links.length) {
    const l = stack('links');
    r.links.forEach((x) => {
      const a = document.createElement('a'); a.className = 'link'; a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = x.label + ' 열기 ↗'; l.appendChild(a);
    });
  }

  if (r.contacts.length) {
    const c = stack('contacts');
    r.contacts.forEach((p) => {
      const card = document.createElement('div'); card.className = 'contact';
      const h = document.createElement('h3'); h.textContent = `${p.role} ${p.name}`;
      const t = document.createElement('p'); t.textContent = p.hours || '';
      const row = document.createElement('div'); row.className = 'row';
      const tel = (p.phone || '').replace(/[^0-9+]/g, '');
      if (tel) { const a = document.createElement('a'); a.className = 'call'; a.href = 'tel:' + tel; a.textContent = '📞 전화하기'; row.appendChild(a); }
      if (/^[^\s@\[\]]+@[^\s@\[\]]+$/.test(p.email || '')) {
        const a = document.createElement('a'); a.className = 'mail';
        a.href = 'mailto:' + p.email + '?subject=' + encodeURIComponent('[학과 도우미] 문의드립니다');
        a.textContent = '✉️ 이메일 보내기'; row.appendChild(a);
      }
      card.append(h, t, row); c.appendChild(card);
    });
  }

  quick.innerHTML = '';
  r.quick_replies.forEach((q) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => send(q); quick.appendChild(b);
  });
}

function scrollToLast(el) { requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' })); }

let busy = false;
async function send(text, silent) {
  if (busy) return; busy = true;
  quick.innerHTML = '';
  if (!silent) bubble('me', text);
  const wait = bubble('bot', '답을 찾고 있어요… ⏳'); wait.classList.add('typing');
  scrollToLast(wait);
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid, message: text }) });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const start = log.children.length - 1;
    wait.remove();
    render(data);
    scrollToLast(log.children[start] || log.lastElementChild);
  } catch (e) {
    wait.classList.remove('typing');
    wait.textContent = navigator.onLine === false
      ? '인터넷이 연결되어 있지 않아요. 와이파이나 데이터를 켠 뒤 다시 눌러 주세요.'
      : '연결에 문제가 있어요. 잠시 후 다시 시도해 주세요.';
    quick.innerHTML = '';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '다시 시도';
    b.onclick = () => { wait.remove(); busy = false; send(text, true); }; quick.appendChild(b);
  } finally { busy = false; }
}

$('f').onsubmit = (e) => {
  e.preventDefault();
  const q = $('q'); const v = q.value.trim();
  if (v) { send(v); q.value = ''; }
};
$('homeBtn').onclick = () => { log.innerHTML = ''; send('처음으로', true); };

// ---- 말로 묻기 (지원하는 브라우저에서만 보임) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $('mic'); mic.hidden = false;
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true;
    mic.classList.add('on'); $('q').placeholder = '말씀하세요…';
    rec.onresult = (e) => { $('q').value = Array.from(e.results).map((r) => r[0].transcript).join(''); };
    rec.onend = () => { mic.classList.remove('on'); $('q').placeholder = '궁금한 것을 적어 보세요'; rec = null; };
    rec.start();
  };
}

// ---- 홈 화면에 추가 안내 ----
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferred = null;
function showInstall() { if (!standalone && store.get('installDismissed') !== '1') $('install').classList.add('show'); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; showInstall(); });
if (isIOS) { $('installText').textContent = '아래 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 고르면 앱처럼 쓸 수 있어요.'; $('installGo').hidden = true; showInstall(); }
$('installGo').onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; } $('install').classList.remove('show'); };
$('installX').onclick = () => { store.set('installDismissed', '1'); $('install').classList.remove('show'); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// ---- 시작 ----
fetch('/api/config').then((r) => r.json()).then((c) => {
  $('appName').textContent = c.app_name; document.title = c.app_name;
  $('dept').textContent = [c.school_name, c.department_name].filter((x) => x && !x.startsWith('[')).join(' ') || '막히면 언제든 물어보세요';
}).catch(() => {});
send('처음으로', true);
</script>
</body>
</html>
