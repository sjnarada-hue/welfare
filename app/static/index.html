<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학과 도우미 테스트</title>
<style>
  :root { --bg:#b2c7d9; --me:#fee500; --bot:#fff; --text:#222; --muted:#555; --btn:#fff; --line:#d0d7de; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e9edf1; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color:var(--text); }
  .phone { max-width:480px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; background:var(--bg); }
  header { background:#a3b8cb; padding:14px 16px; font-size:19px; font-weight:700; }
  header small { display:block; font-size:13px; font-weight:400; color:#333; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:12px 14px; border-radius:14px; font-size:18px; line-height:1.55; white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
  .bot { align-self:flex-start; background:var(--bot); border-top-left-radius:4px; }
  .me  { align-self:flex-end; background:var(--me); border-top-right-radius:4px; }
  .tag { display:block; font-size:12px; color:var(--muted); margin-top:6px; }
  .menu, .links { align-self:stretch; display:flex; flex-direction:column; gap:8px; }
  .menu button { font-size:19px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--btn); text-align:left; cursor:pointer; font-weight:600; }
  .menu button::before { content:"👉 "; }
  .links a, .links button { display:block; font-size:17px; padding:12px; border-radius:10px; background:#fff; border:1px solid var(--line); text-align:center; color:#1a5fb4; text-decoration:none; font-weight:600; }
  .quick { display:flex; gap:8px; flex-wrap:wrap; padding:8px 12px; background:#c4d3e0; min-height:0; }
  .quick button { font-size:16px; padding:10px 14px; border-radius:20px; border:1px solid #9fb3c6; background:#fff; cursor:pointer; }
  form { display:flex; gap:8px; padding:10px; background:#fff; }
  input { flex:1; font-size:18px; padding:12px; border:1px solid var(--line); border-radius:10px; min-width:0; }
  form button { font-size:18px; padding:0 18px; border:0; border-radius:10px; background:var(--me); font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="phone">
  <header>학과 도우미 <small>카카오톡 연결 전 테스트 화면입니다</small></header>
  <div id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="f">
    <input id="q" placeholder="궁금한 것을 적어 보세요" autocomplete="off">
    <button>보내기</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const quick = document.getElementById('quick');
let sid;
try { sid = localStorage.getItem('sid'); } catch (e) {}
if (!sid) { sid = Math.random().toString(36).slice(2); try { localStorage.setItem('sid', sid); } catch (e) {} }

const SOURCE = { menu: '정해진 답변', ai: 'AI 답변 · 틀릴 수 있어요', handoff: '사람 연결', privacy: '개인정보 보호', fallback: '안내' };

function add(cls, text, source) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (source && SOURCE[source]) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = SOURCE[source]; d.appendChild(t); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function render(r) {
  add('bot', r.text, r.source);
  if (r.menu.length) {
    const m = document.createElement('div'); m.className = 'menu';
    r.menu.forEach(label => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => send(label); m.appendChild(b); });
    log.appendChild(m);
  }
  if (r.links.length || r.operator) {
    const l = document.createElement('div'); l.className = 'links';
    if (r.operator) { const b = document.createElement('button'); b.textContent = '상담원 연결 (카카오톡에서 1:1 채팅으로 바뀝니다)'; b.disabled = true; l.appendChild(b); }
    r.links.forEach(x => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = x.label + ' ↗'; l.appendChild(a); });
    log.appendChild(l);
  }
  quick.innerHTML = '';
  r.quick_replies.forEach(q => { const b = document.createElement('button'); b.textContent = q; b.onclick = () => send(q); quick.appendChild(b); });
  log.scrollTop = log.scrollHeight;
}

async function send(text, silent) {
  if (!silent) add('me', text);
  const wait = add('bot', '답을 찾고 있어요… ⏳');
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid, message: text }) });
    wait.remove();
    render(await res.json());
  } catch (e) {
    wait.textContent = '연결에 문제가 있어요. 잠시 후 다시 시도해 주세요.';
  }
}

document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById('q');
  if (q.value.trim()) { send(q.value.trim()); q.value = ''; }
};
send('처음으로', true);
</script>
</body>
</html>
